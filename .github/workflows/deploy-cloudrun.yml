name: Deploy Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

env:
  SERVICE: cursor-discord
  ARTIFACT_REPO: cursor-discord

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve project / region
        id: meta
        env:
          VAR_PROJECT: ${{ vars.GCP_PROJECT }}
          SECRET_PROJECT: ${{ secrets.GCP_PROJECT }}
          VAR_REGION: ${{ vars.GCP_REGION }}
        run: |
          set -euo pipefail
          PROJECT="${VAR_PROJECT:-${SECRET_PROJECT:-}}"
          REGION="${VAR_REGION:-us-central1}"
          if [[ -z "${PROJECT}" ]]; then
            echo "Set repository variable or secret GCP_PROJECT" >&2
            exit 1
          fi
          echo "project=${PROJECT}" >> "$GITHUB_OUTPUT"
          echo "region=${REGION}" >> "$GITHUB_OUTPUT"
          gcloud config set project "${PROJECT}"

      - name: Ensure Artifact Registry repo
        run: |
          set -euo pipefail
          REGION="${{ steps.meta.outputs.region }}"
          if ! gcloud artifacts repositories describe "${ARTIFACT_REPO}" --location="${REGION}" >/dev/null 2>&1; then
            gcloud artifacts repositories create "${ARTIFACT_REPO}" \
              --repository-format=docker \
              --location="${REGION}" \
              --description="cursor-discord images"
          fi

      - name: Sync app secrets into Secret Manager
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GCP_PROJECT: ${{ steps.meta.outputs.project }}
        run: |
          set -euo pipefail
          upsert() {
            local name="$1"
            local value="$2"
            if [[ -z "${value}" ]]; then
              echo "Missing GitHub secret for ${name}" >&2
              exit 1
            fi
            if ! gcloud secrets describe "${name}" >/dev/null 2>&1; then
              gcloud secrets create "${name}" --replication-policy=automatic
            fi
            printf '%s' "${value}" | gcloud secrets versions add "${name}" --data-file=-
          }
          upsert discord-token "${DISCORD_TOKEN}"
          upsert discord-client-id "${DISCORD_CLIENT_ID}"
          upsert cursor-api-key "${CURSOR_API_KEY}"

          PROJECT_NUMBER="$(gcloud projects describe "${GCP_PROJECT}" --format='value(projectNumber)')"
          RUNTIME_SA="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          for s in discord-token discord-client-id cursor-api-key; do
            gcloud secrets add-iam-policy-binding "${s}" \
              --member="serviceAccount:${RUNTIME_SA}" \
              --role="roles/secretmanager.secretAccessor" \
              --quiet >/dev/null || true
          done

      - name: Build and push image
        id: image
        run: |
          set -euo pipefail
          REGION="${{ steps.meta.outputs.region }}"
          PROJECT="${{ steps.meta.outputs.project }}"
          TAG="${GITHUB_SHA::7}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/${ARTIFACT_REPO}/${SERVICE}"
          FULL="${IMAGE}:${TAG}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          # Submit async + poll status. Waiting with log streaming fails for the
          # deploy SA (default logs bucket ACL) even when --suppress-logs is set.
          BUILD_ID="$(gcloud builds submit --tag "${FULL}" . --async --format='value(id)')"
          echo "Cloud Build ${BUILD_ID} → ${FULL}"
          for _ in $(seq 1 60); do
            STATUS="$(gcloud builds describe "${BUILD_ID}" --format='value(status)')"
            case "${STATUS}" in
              SUCCESS)
                echo "image=${FULL}" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Cloud Build ${BUILD_ID} failed: ${STATUS}" >&2
                echo "Logs: https://console.cloud.google.com/cloud-build/builds/${BUILD_ID}?project=${PROJECT}" >&2
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for Cloud Build ${BUILD_ID} (last=${STATUS:-unknown})" >&2
          exit 1

      - name: Deploy Cloud Run
        env:
          PROJECTS_JSON: ${{ secrets.PROJECTS_JSON }}
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
          ALLOWED_GUILD_IDS: ${{ secrets.ALLOWED_GUILD_IDS }}
          CURSOR_MODEL: ${{ secrets.CURSOR_MODEL }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          set -euo pipefail
          REGION="${{ steps.meta.outputs.region }}"
          ENV_FILE="$(mktemp)"
          python3 - <<'PY' > "${ENV_FILE}"
          import json, os
          print("# generated by deploy-cloudrun workflow")
          projects = os.environ.get("PROJECTS_JSON") or ""
          if projects.strip():
              print("PROJECTS_JSON:", json.dumps(projects))
          for key in (
              "ALLOWED_USER_IDS",
              "ALLOWED_GUILD_IDS",
              "CURSOR_MODEL",
              "DISCORD_GUILD_ID",
          ):
              val = os.environ.get(key) or ""
              if val.strip():
                  print(f'{key}: {json.dumps(val)}')
          PY

          ARGS=(
            gcloud run deploy "${SERVICE}"
            --image="${{ steps.image.outputs.image }}"
            --region="${REGION}"
            --platform=managed
            --allow-unauthenticated
            --min-instances=1
            --max-instances=1
            --cpu=1
            --memory=512Mi
            --no-cpu-throttling
            --timeout=3600
            --port=8080
            --set-secrets=DISCORD_TOKEN=discord-token:latest,CURSOR_API_KEY=cursor-api-key:latest,DISCORD_CLIENT_ID=discord-client-id:latest
          )
          if grep -Ev '^(#|$)' "${ENV_FILE}" >/dev/null; then
            ARGS+=(--env-vars-file="${ENV_FILE}")
          fi
          "${ARGS[@]}"
          gcloud run services describe "${SERVICE}" --region="${REGION}" --format='value(status.url)'
