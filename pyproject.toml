[project]
name = "cursor-discord"
version = "0.1.0"
description = "Discord command plane for Cursor cloud agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cursor-sdk>=1.2.0,<2",
  "discord.py>=2.4.0,<3",
  "aiohttp>=3.10.0,<4",
  "pyyaml>=6.0,<7",
  "python-dotenv>=1.0.0,<2",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8.0",
]

[project.scripts]
cursor-discord = "bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402", "I001", "F401"]
"bot/ui.py" = ["I001"]
