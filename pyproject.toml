[project]
name = "cursor-discord"
version = "0.1.0"
description = "Discord command plane for Cursor cloud agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cursor-sdk>=1.2.0",
  "discord.py>=2.4.0",
  "aiohttp>=3.10.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
cursor-discord = "bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]
